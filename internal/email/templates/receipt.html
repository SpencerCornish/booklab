<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Receipt</title></head>
<body style="font-family:sans-serif;max-width:600px;margin:0 auto;padding:24px;color:#1a1a1a;">
  <h1 style="color:#16a34a;margin-bottom:4px;">Receipt – {{.ResourceName}}</h1>
  <p style="color:#555;margin-top:0;">Thank you, {{.BookerName}}! Here's your receipt.</p>

  <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:20px;margin:24px 0;">
    <p style="margin:0 0 8px;"><strong>Session start:</strong> {{formatTime .StartTime}}</p>
    <p style="margin:0 0 8px;"><strong>Session end:</strong> {{formatTime .EndTime}}</p>
    <p style="margin:0;font-size:20px;"><strong>Amount charged: {{formatMoney .AmountCents}}</strong></p>
  </div>

  {{if .StripeReceiptURL}}
  <p style="margin:24px 0;">
    <a href="{{.StripeReceiptURL}}" style="display:inline-block;background:#1d4ed8;color:white;padding:10px 20px;border-radius:6px;text-decoration:none;">View Stripe Receipt</a>
  </p>
  {{end}}

  <p style="color:#9ca3af;font-size:12px;border-top:1px solid #e5e7eb;padding-top:16px;">
    Questions? Reply to this email.
  </p>
</body>
</html>
