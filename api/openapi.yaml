openapi: 3.1.0
info:
  title: BookLab API
  description: Self-hosted resource booking system with hourly post-use billing via Stripe.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: /api
    description: Relative to the running server

tags:
  - name: public
    description: Public booking endpoints
  - name: admin
    description: Admin-only endpoints (session auth required)
  - name: display
    description: >
      E-ink door-sign endpoints speaking the TRMNL firmware "bring your own server"
      protocol. Called by devices, not browsers. See docs/eink-display.md.

paths:
  /settings/public:
    get:
      tags: [public]
      summary: Get public settings
      description: Returns resource name, hourly rate, currency, and bookable hour window - no secrets.
      operationId: getPublicSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"

  /terms:
    get:
      tags: [public]
      summary: Get terms and conditions content
      operationId: getTerms
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalContent"

  /privacy:
    get:
      tags: [public]
      summary: Get privacy policy content
      operationId: getPrivacy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalContent"

  /availability:
    get:
      tags: [public]
      summary: Get available time slots for a date
      description: Returns list of available 1-hour slots accounting for bookings, closures, and configured hours. When the new-user gate is enabled, new_user=true returns slots from the trainer's weekly schedule instead of the normal bookable hours.
      operationId: getAvailability
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-06-01"
        - name: new_user
          in: query
          required: false
          description: Self-reported answer to the pre-schedule question. Only meaningful while the new-user gate is enabled.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /availability/days:
    get:
      tags: [public]
      summary: List upcoming dates that have bookable time
      description: Returns the dates within the coming days that offer at least min_hours of contiguous bookable time, honouring closures, existing bookings, and minimum notice. Uses the trainer's weekly schedule when the new-user gate is enabled and new_user=true. Lets clients grey out days with no availability.
      operationId: getAvailableDays
      parameters:
        - name: days
          in: query
          required: false
          description: How many days from today to scan. Defaults to 60, capped at 90.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 60
        - name: new_user
          in: query
          required: false
          description: Self-reported answer to the pre-schedule question. Only meaningful while the new-user gate is enabled.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableDaysResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /bookings/prepare:
    post:
      tags: [public]
      summary: Prepare Stripe SetupIntent for a booking
      description: Validates slot availability and returns a Stripe SetupIntent client secret. Does not create a booking row. While a new-customer restriction covers the session dates, customers with no completed booking get 403.
      operationId: prepareBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareBookingRequest"
      responses:
        "200":
          description: SetupIntent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareBookingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: New-customer restriction applies to this session and the email has no completed booking. The error message is the admin's restriction message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Time slot conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many SetupIntents created from this client IP in the last hour (limit 10). Requests that fail validation do not count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings:
    post:
      tags: [public]
      summary: Finalize a booking after card confirmation
      description: Verifies the SetupIntent succeeded, inserts a confirmed booking with payment method on file, and sends confirmation emails.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBookingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: New-customer restriction applies to this session and the email has no completed booking. The error message is the admin's restriction message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Time slot conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many bookings created from this client IP in the last hour (limit 20). Idempotent replays of the same setup_intent_id do not count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings/{token}:
    get:
      tags: [public]
      summary: View booking by magic token
      operationId: getBooking
      parameters:
        - $ref: "#/components/parameters/CancelToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPublic"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{token}/cancel:
    post:
      tags: [public]
      summary: Cancel booking via magic token
      operationId: cancelBooking
      parameters:
        - $ref: "#/components/parameters/CancelToken"
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPublic"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Booking cannot be cancelled (already cancelled or charged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/login:
    post:
      tags: [admin]
      summary: Admin login
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in - sets session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many failed logins in the last 15 minutes for this username or client IP (limit 10 each).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/logout:
    post:
      tags: [admin]
      summary: Admin logout
      operationId: adminLogout
      responses:
        "204":
          description: Logged out

  /admin/bookings:
    get:
      tags: [admin]
      summary: List bookings
      operationId: adminListBookings
      security:
        - sessionCookie: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingAdmin"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/bookings/{id}:
    patch:
      tags: [admin]
      summary: Adjust booking
      description: Adjust end_time or status of a booking.
      operationId: adminUpdateBooking
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BookingID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/bookings/{id}/charge:
    post:
      tags: [admin]
      summary: Charge a booking
      description: Creates an off-session PaymentIntent using the saved payment method.
      operationId: adminChargeBooking
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BookingID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargeBookingRequest"
      responses:
        "200":
          description: Charged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/settings:
    get:
      tags: [admin]
      summary: Get all settings
      operationId: adminGetSettings
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [admin]
      summary: Update settings
      operationId: adminUpdateSettings
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/insights:
    get:
      tags: [admin]
      summary: Get booking insights
      description: Returns aggregate booking stats and referral source breakdown.
      operationId: adminGetInsights
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/users:
    get:
      tags: [admin]
      summary: List admin users
      operationId: adminListUsers
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [admin]
      summary: Create admin user
      operationId: adminCreateUser
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/me/password:
    put:
      tags: [admin]
      summary: Change own password
      operationId: adminChangePassword
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/users/{username}:
    delete:
      tags: [admin]
      summary: Delete admin user
      operationId: adminDeleteUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AdminUsername"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/closures:
    get:
      tags: [admin]
      summary: List closures
      operationId: adminListClosures
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Closure"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [admin]
      summary: Create closure
      operationId: adminCreateClosure
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertClosureRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Closure"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/closures/{id}:
    put:
      tags: [admin]
      summary: Update closure
      operationId: adminUpdateClosure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClosureID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertClosureRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Closure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Delete closure
      operationId: adminDeleteClosure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClosureID"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /setup:
    get:
      tags: [display]
      summary: Register a display (TRMNL setup)
      description: >
        Called once by the device firmware. Issues an API key; the display stays pending until
        an admin approves it. Re-running setup for a known MAC issues a new key and returns the
        display to pending. Revoked MACs, invalid MACs and setups beyond the pending-display cap
        get 404, which the firmware shows as "not registered".
      operationId: displaySetup
      parameters:
        - name: ID
          in: header
          required: true
          description: Device MAC address.
          schema:
            type: string
            example: "AA:BB:CC:DD:EE:FF"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplaySetupResponse"
        "404":
          description: Not registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum: [404]
                  message:
                    type: string

  /display:
    get:
      tags: [display]
      summary: Poll for the current screen (TRMNL display)
      description: >
        Called on every wake. Always answers HTTP 200; the JSON `status` is 0 with an image, or
        202 when the key is not recognised (the firmware then shows its friendly ID and polls
        again soon). An unknown key from a MAC this server has never seen is registered as a
        pending display. `filename` only changes when the image does, so the firmware can skip
        redraws. `refresh_rate` is the number of seconds to sleep.
      operationId: displayPoll
      parameters:
        - name: Access-Token
          in: header
          required: true
          schema:
            type: string
        - name: ID
          in: header
          required: true
          schema:
            type: string
        - name: Battery-Voltage
          in: header
          schema:
            type: number
        - name: RSSI
          in: header
          schema:
            type: integer
        - name: FW-Version
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Display instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayPollResponse"

  /display/image/{token}/{file}:
    get:
      tags: [display]
      summary: Fetch a display image
      description: >
        The 1-bit 800x480 PNG named by /display. The device fetches it without headers, so the
        per-display token in the path is the credential; it rotates when a display is revoked
        or returned to pending.
      operationId: displayImage
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: file
          in: path
          required: true
          schema:
            type: string
            example: 3f9a0c1d2e4b5a69.png
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown token

  /log:
    post:
      tags: [display]
      summary: Accept device logs (TRMNL log)
      description: Accepted and discarded so devices do not retry.
      operationId: displayLog
      responses:
        "204":
          description: Accepted

  /admin/displays:
    get:
      tags: [admin]
      summary: List displays
      operationId: adminListDisplays
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Display"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/displays/preview.png:
    get:
      tags: [admin]
      summary: Preview the door sign
      description: Renders the screen an approved display would show right now.
      operationId: adminPreviewDisplay
      security:
        - sessionCookie: []
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/displays/{id}:
    patch:
      tags: [admin]
      summary: Rename, approve or revoke a display
      operationId: adminUpdateDisplay
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DisplayID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDisplayRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Delete a display
      description: A deleted device that polls again with its old key is re-registered as pending.
      operationId: adminDeleteDisplay
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DisplayID"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: booklab_session

  parameters:
    CancelToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ClosureID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    DisplayID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AdminUsername:
      name: username
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    BookingStatus:
      type: string
      enum: [confirmed, cancelled, completed, charging, charged]

    InsightsResponse:
      type: object
      required:
        - total_bookings
        - total_revenue_cents
        - unique_customers
        - recent_bookings
        - bookings_by_status
        - referral_sources
        - customers
      properties:
        total_bookings:
          type: integer
        total_revenue_cents:
          type: integer
        unique_customers:
          type: integer
        recent_bookings:
          type: integer
          description: Bookings created in the last 30 days
        bookings_by_status:
          type: object
          additionalProperties:
            type: integer
        referral_sources:
          type: array
          items:
            $ref: "#/components/schemas/ReferralSourceCount"
        customers:
          type: array
          items:
            $ref: "#/components/schemas/CustomerInsight"

    CustomerInsight:
      type: object
      required: [email, name, booking_count, cancelled_count, revenue_cents]
      properties:
        email:
          type: string
        name:
          type: string
        booking_count:
          type: integer
          description: Non-cancelled bookings
        cancelled_count:
          type: integer
        revenue_cents:
          type: integer
          description: Collected revenue from charged bookings
        last_booking_at:
          type: string
          format: date-time
          nullable: true

    ReferralSourceCount:
      type: object
      required: [source, count]
      properties:
        source:
          type: string
        count:
          type: integer

    PublicSettings:
      type: object
      properties:
        resource_name:
          type: string
        hourly_rate_cents:
          type: integer
        currency:
          type: string
        bookable_start:
          type: string
          example: "09:00"
        bookable_end:
          type: string
          example: "21:00"
        min_hours:
          type: integer
        max_hours:
          type: integer
        min_lead_hours:
          type: integer
          description: Bookings must start at least this many hours from now. 0 means no notice is required.
        timezone:
          type: string
        referral_sources:
          type: array
          items:
            type: string
        new_customer_restriction:
          description: Present only while the window is set and its end date has not passed. The message is the admin's text, or a default built from the dates when blank.
          oneOf:
            - $ref: "#/components/schemas/NewCustomerRestriction"
            - type: "null"
        new_user_gate:
          description: Present only while the pre-schedule gate is enabled. The trainer schedule itself is not exposed.
          oneOf:
            - $ref: "#/components/schemas/NewUserGatePublic"
            - type: "null"

    NewUserGatePublic:
      type: object
      required: [enabled, question]
      properties:
        enabled:
          type: boolean
        question:
          type: string
          example: "Have you used this space before?"

    NewUserWindow:
      type: object
      required: [weekday, start, end]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday.
        start:
          type: string
          example: "15:00"
        end:
          type: string
          example: "20:00"

    NewUserGate:
      type: object
      required: [enabled, question, schedule]
      properties:
        enabled:
          type: boolean
        question:
          type: string
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/NewUserWindow"

    NewCustomerRestriction:
      type: object
      required: [start_date, end_date, message]
      properties:
        start_date:
          type: string
          format: date
          example: "2035-06-01"
        end_date:
          type: string
          format: date
          description: Inclusive. The window covers whole days in the settings timezone.
          example: "2035-06-30"
        message:
          type: string

    Settings:
      allOf:
        - $ref: "#/components/schemas/PublicSettings"
        - type: object
          properties:
            reminder_hours_before:
              type: integer
            notification_emails:
              type: string
            auto_charge_delay_minutes:
              type: integer
            terms_content:
              type: string
            privacy_content:
              type: string
            new_customer_restriction:
              description: The configured window, or null when unset. The message is returned as stored, so it may be empty.
              oneOf:
                - $ref: "#/components/schemas/NewCustomerRestriction"
                - type: "null"
            new_user_gate:
              description: The gate configuration; schedule may be empty even while enabled.
              $ref: "#/components/schemas/NewUserGate"
            display_refresh_minutes:
              type: integer
              description: How often door-sign displays refresh during bookable hours.

    LegalContent:
      type: object
      required: [content]
      properties:
        content:
          type: string

    UpdateSettingsRequest:
      type: object
      properties:
        resource_name:
          type: string
        hourly_rate_cents:
          type: integer
        currency:
          type: string
        timezone:
          type: string
        bookable_start:
          type: string
        bookable_end:
          type: string
        min_hours:
          type: integer
        max_hours:
          type: integer
        min_lead_hours:
          type: integer
          minimum: 0
        reminder_hours_before:
          type: integer
        notification_emails:
          type: string
        auto_charge_delay_minutes:
          type: integer
        referral_sources:
          type: array
          items:
            type: string
        terms_content:
          type: string
        privacy_content:
          type: string
        new_customer_restriction:
          description: Omit to leave the window unchanged. Send null to clear it. end_date must be on or after start_date.
          oneOf:
            - $ref: "#/components/schemas/NewCustomerRestriction"
            - type: "null"
        new_user_gate:
          description: Omit to leave the gate unchanged. Windows must not overlap on the same weekday; a blank question falls back to the default.
          $ref: "#/components/schemas/NewUserGate"
        display_refresh_minutes:
          type: integer
          minimum: 1
          maximum: 60

    AvailabilityResponse:
