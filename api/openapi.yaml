openapi: 3.1.0
info:
  title: BookLab API
  description: Self-hosted resource booking system with hourly post-use billing via Stripe.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: /api
    description: Relative to the running server

tags:
  - name: public
    description: Public booking endpoints
  - name: admin
    description: Admin-only endpoints (session auth required)

paths:
  /settings/public:
    get:
      tags: [public]
      summary: Get public settings
      description: Returns resource name, hourly rate, currency, and bookable hour window - no secrets.
      operationId: getPublicSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"

  /terms:
    get:
      tags: [public]
      summary: Get terms and conditions content
      operationId: getTerms
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalContent"

  /privacy:
    get:
      tags: [public]
      summary: Get privacy policy content
      operationId: getPrivacy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalContent"

  /interest-submissions:
    post:
      tags: [public]
      summary: Submit interest for outreach
      description: Saves a contact submission when screening routes the user to collect info instead of booking.
      operationId: createInterestSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterestSubmissionRequest"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestSubmission"
        "400":
          $ref: "#/components/responses/BadRequest"

  /availability:
    get:
      tags: [public]
      summary: Get available time slots for a date
      description: Returns list of available 1-hour slots accounting for bookings, closures, and configured hours.
      operationId: getAvailability
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-06-01"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /bookings:
    post:
      tags: [public]
      summary: Create a booking
      description: Creates a confirmed booking and returns a Stripe SetupIntent client_secret for card collection.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBookingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Time slot conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings/{token}:
    get:
      tags: [public]
      summary: View booking by magic token
      operationId: getBooking
      parameters:
        - $ref: "#/components/parameters/CancelToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPublic"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{token}/cancel:
    post:
      tags: [public]
      summary: Cancel booking via magic token
      operationId: cancelBooking
      parameters:
        - $ref: "#/components/parameters/CancelToken"
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPublic"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Booking cannot be cancelled (already cancelled or charged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/login:
    post:
      tags: [admin]
      summary: Admin login
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in - sets session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/logout:
    post:
      tags: [admin]
      summary: Admin logout
      operationId: adminLogout
      responses:
        "204":
          description: Logged out

  /admin/bookings:
    get:
      tags: [admin]
      summary: List bookings
      operationId: adminListBookings
      security:
        - sessionCookie: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingAdmin"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/bookings/{id}:
    patch:
      tags: [admin]
      summary: Adjust booking
      description: Adjust end_time or status of a booking.
      operationId: adminUpdateBooking
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BookingID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/bookings/{id}/charge:
    post:
      tags: [admin]
      summary: Charge a booking
      description: Creates an off-session PaymentIntent using the saved payment method.
      operationId: adminChargeBooking
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BookingID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargeBookingRequest"
      responses:
        "200":
          description: Charged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/settings:
    get:
      tags: [admin]
      summary: Get all settings
      operationId: adminGetSettings
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [admin]
      summary: Update settings
      operationId: adminUpdateSettings
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/insights:
    get:
      tags: [admin]
      summary: Get booking insights
      description: Returns aggregate booking stats and referral source breakdown.
      operationId: adminGetInsights
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/users:
    get:
      tags: [admin]
      summary: List admin users
      operationId: adminListUsers
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [admin]
      summary: Create admin user
      operationId: adminCreateUser
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/me/password:
    put:
      tags: [admin]
      summary: Change own password
      operationId: adminChangePassword
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/users/{username}:
    delete:
      tags: [admin]
      summary: Delete admin user
      operationId: adminDeleteUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AdminUsername"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/closures:
    get:
      tags: [admin]
      summary: List closures
      operationId: adminListClosures
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Closure"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [admin]
      summary: Create closure
      operationId: adminCreateClosure
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertClosureRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Closure"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/closures/{id}:
    put:
      tags: [admin]
      summary: Update closure
      operationId: adminUpdateClosure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClosureID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertClosureRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Closure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Delete closure
      operationId: adminDeleteClosure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClosureID"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: booklab_session

  parameters:
    CancelToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ClosureID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AdminUsername:
      name: username
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    BookingStatus:
      type: string
      enum: [confirmed, cancelled, completed, charging, charged]

    InsightsResponse:
      type: object
      required:
        - total_bookings
        - total_revenue_cents
        - unique_customers
        - recent_bookings
        - bookings_by_status
        - referral_sources
        - customers
      properties:
        total_bookings:
          type: integer
        total_revenue_cents:
          type: integer
        unique_customers:
          type: integer
        recent_bookings:
          type: integer
          description: Bookings created in the last 30 days
        bookings_by_status:
          type: object
          additionalProperties:
            type: integer
        referral_sources:
          type: array
          items:
            $ref: "#/components/schemas/ReferralSourceCount"
        customers:
          type: array
          items:
            $ref: "#/components/schemas/CustomerInsight"

    CustomerInsight:
      type: object
      required: [email, name, booking_count, cancelled_count, revenue_cents]
      properties:
        email:
          type: string
        name:
          type: string
        booking_count:
          type: integer
          description: Non-cancelled bookings
        cancelled_count:
          type: integer
        revenue_cents:
          type: integer
          description: Collected revenue from charged bookings
        last_booking_at:
          type: string
          format: date-time
          nullable: true

    ReferralSourceCount:
      type: object
      required: [source, count]
      properties:
        source:
          type: string
        count:
          type: integer

    PublicSettings:
      type: object
      properties:
        resource_name:
          type: string
        hourly_rate_cents:
          type: integer
        currency:
          type: string
        bookable_start:
          type: string
          example: "09:00"
        bookable_end:
          type: string
          example: "21:00"
        min_hours:
          type: integer
        max_hours:
          type: integer
        timezone:
          type: string
        referral_sources:
          type: array
          items:
            type: string
        booking_screening:
          $ref: "#/components/schemas/BookingScreening"
          nullable: true
        min_booking_lead_minutes:
          type: integer
          description: Minimum minutes before a slot starts that it can be booked. 0 allows booking up to the last minute.

    Settings:
      allOf:
        - $ref: "#/components/schemas/PublicSettings"
        - type: object
          properties:
            reminder_hours_before:
              type: integer
            notification_emails:
              type: string
            auto_charge_delay_minutes:
              type: integer
            terms_content:
              type: string
            privacy_content:
              type: string

    LegalContent:
      type: object
      required: [content]
      properties:
        content:
          type: string

    UpdateSettingsRequest:
      type: object
      properties:
        resource_name:
          type: string
        hourly_rate_cents:
          type: integer
        currency:
          type: string
        timezone:
          type: string
        bookable_start:
          type: string
        bookable_end:
          type: string
        min_hours:
          type: integer
        max_hours:
          type: integer
        reminder_hours_before:
          type: integer
        notification_emails:
          type: string
        auto_charge_delay_minutes:
          type: integer
        referral_sources:
          type: array
          items:
            type: string
        terms_content:
          type: string
        privacy_content:
          type: string
        booking_screening:
          $ref: "#/components/schemas/BookingScreening"
          nullable: true
        min_booking_lead_minutes:
          type: integer

    BookingScreening:
      type: object
      required: [enabled, title, question, options, collect_info_heading, collect_info_description]
      properties:
        enabled:
          type: boolean
        title:
          type: string
        description:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/BookingScreeningOption"
        collect_info_heading:
          type: string
        collect_info_description:
          type: string

    BookingScreeningOption:
      type: object
      required: [label, outcome]
      properties:
        label:
          type: string
        outcome:
          type: string
          enum: [proceed, collect_info]

    CreateInterestSubmissionRequest:
      type: object
      required: [name, email, selected_option]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        message:
          type: string
        selected_option:
          type: string

    InterestSubmission:
      type: object
      required: [id, name, email, selected_option, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        selected_option:
          type: string
        created_at:
          type: string
          format: date-time

    AvailabilityResponse:
      type: object
      required: [date, slots, is_closed]
      properties:
        date:
          type: string
          format: date
        is_closed:
          type: boolean
        closure_reason:
          type: string
          nullable: true
        slots:
          type: array
          items:
            $ref: "#/components/schemas/TimeSlot"

    TimeSlot:
      type: object
      required: [start, end, available]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        available:
          type: boolean

    CreateBookingRequest:
      type: object
      required: [name, email, start_time, end_time]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time

    CreateBookingResponse:
      type: object
      required: [booking, setup_intent_client_secret]
      properties:
        booking:
          $ref: "#/components/schemas/BookingPublic"
        setup_intent_client_secret:
          type: string

    BookingPublic:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/BookingStatus"
        cancel_token:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    BookingAdmin:
      allOf:
        - $ref: "#/components/schemas/BookingPublic"
        - type: object
          properties:
            stripe_setup_intent_id:
              type: string
              nullable: true
            stripe_payment_method_id:
              type: string
              nullable: true
            stripe_payment_intent_id:
              type: string
              nullable: true
            amount_cents:
              type: integer
              nullable: true

    UpdateBookingRequest:
      type: object
      properties:
        end_time:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/BookingStatus"

    ChargeBookingRequest:
      type: object
      properties:
        amount_cents:
          type: integer
          description: Override amount; defaults to hourly_rate * hours

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        created_at:
          type: string
          format: date-time

    AdminUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        current_username:
          type: string

    CreateAdminUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    Closure:
      type: object
      properties:
        id:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        all_day:
          type: boolean
        start_time:
          type: string
          nullable: true
          description: HH:MM, present when all_day is false
        end_time:
          type: string
          nullable: true
          description: HH:MM, present when all_day is false
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    UpsertClosureRequest:
      type: object
      required: [start_date, end_date]
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        all_day:
          type: boolean
          default: true
        start_time:
          type: string
          description: HH:MM, required when all_day is false
        end_time:
          type: string
          description: HH:MM, required when all_day is false
        reason:
          type: string
