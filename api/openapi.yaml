            type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        new_user:
          type: boolean
          description: Self-reported answer to the pre-schedule question. Required while the new-user gate is enabled; ignored otherwise.

    PrepareBookingRequest:
      type: object
