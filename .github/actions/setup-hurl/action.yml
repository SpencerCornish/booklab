name: Set up Hurl
description: >
  Installs the pinned Hurl release binary. hurl's Linux build links
  libxml2 dynamically, which the ubuntu-24.04 runner image does not ship,
  so install it first.
runs:
  using: composite
  steps:
    - name: Install libxml2 (hurl links against it)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2

    - name: Install hurl
      shell: bash
      run: |
        curl -fsSL -o /tmp/hurl.tar.gz "https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl-8.0.1-x86_64-unknown-linux-gnu.tar.gz"
        tar -xzf /tmp/hurl.tar.gz -C /tmp
        sudo install /tmp/hurl-8.0.1-x86_64-unknown-linux-gnu/bin/hurl /usr/local/bin/hurl
        hurl --version