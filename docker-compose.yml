services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Host `go run` / `make dev-api` uses DATABASE_URL=...@localhost:5432/...
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: booklab
      POSTGRES_USER: booklab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booklab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booklab"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgres://booklab:${POSTGRES_PASSWORD:-booklab}@db:5432/booklab?sslmode=disable
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""

volumes:
  pgdata:
